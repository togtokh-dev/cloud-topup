name: Publish to NPM

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Publish NPM Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org/

      - name: Check NPM Token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is not set"
            exit 1
          else
            echo "NPM_TOKEN is set"
            echo "Token length: ${#NPM_TOKEN}"
            echo "Token prefix: ${NPM_TOKEN:0:4}****"
            echo "Token suffix: ****${NPM_TOKEN: -4}"
          fi

      - name: Authenticate with NPM
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          echo ".npmrc created successfully"

      - name: Verify npm auth setup
        run: |
          if [ -f ~/.npmrc ]; then
            echo ".npmrc exists"
            sed 's/_authToken=.*/_authToken=****/' ~/.npmrc
          else
            echo ".npmrc not found"
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Build the package
        run: npm run build

      - name: Publish the package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --loglevel verbose

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up sensitive files"
          rm -f ~/.npmrc
